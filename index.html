<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To My Aradhya — Our Little Forever</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Sans:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--rose:#e8a5b4;--gold:#d4af6a;--cream:#fbf1e6;--bur:#4a0f24;--lav:#c9b6e4;--ink:#3a1020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;height:100%}
body{margin:0;font:16px/1.65 'DM Sans',sans-serif;background:var(--bur);color:var(--cream);overflow-x:hidden;color-scheme:dark}
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600;margin:.3em 0;line-height:1.2}h1{font-size:clamp(2rem,8vw,3.6rem)}h2{font-size:clamp(1.6rem,6vw,2.4rem)}
.hw{font-family:Caveat,cursive;font-size:1.3rem}.big{font-size:1.6rem}.sm{font-size:.85rem;opacity:.8}
button{font:inherit;cursor:pointer;color:inherit}:focus-visible{outline:3px solid #fff;outline-offset:3px}
section{padding:72px 16px;max-width:920px;margin:auto;text-align:center;position:relative}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 0,#8a2a4b,transparent 55%),linear-gradient(160deg,#4a0f24,#7a2c46 60%,#3b1a4a)}
.pt i{position:fixed;top:-20px;width:12px;height:16px;border-radius:80% 0;background:#f4a6bd88;animation:fall linear infinite}
.btn{background:linear-gradient(135deg,#efcf8c,#d4af6a);color:var(--ink);border:0;border-radius:99px;padding:12px 26px;font-weight:600;box-shadow:0 6px 24px #d4af6a55;margin:10px 4px}
.glass{background:#ffffff14;backdrop-filter:blur(10px);border:1px solid #ffffff2a;border-radius:20px;padding:18px}
.paper{background:var(--cream);color:var(--ink);border-radius:6px;box-shadow:0 10px 30px #0006;padding:22px;max-width:420px;margin:24px auto}
.paper .hw{font-size:1.5rem;white-space:pre-line}
.rv{opacity:0;filter:blur(4px);transform:translateY(14px);transition:all 1s}.rv.in{opacity:1;filter:none;transform:none}
/* envelope */
.env{position:relative;width:min(300px,84vw);height:200px;margin:130px auto 20px;background:#ead3b3;border-radius:6px;box-shadow:0 20px 50px #0008;cursor:pointer;transition:box-shadow 1s}
.env.o{box-shadow:0 0 90px #ffd98a99}
.env .lt{position:absolute;left:8%;right:8%;top:10px;height:170px;background:#fffaf2;border-radius:4px;transition:transform .9s .5s;z-index:1}
.env.o .lt{transform:translateY(-120px)}
.env .fr{position:absolute;inset:0;background:#efdcc2;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:2}
.env .fl{position:absolute;left:0;right:0;top:0;height:60%;background:#e2c8a4;clip-path:polygon(0 0,100% 0,50% 92%);transform-origin:top;transition:transform .7s,z-index 0s .35s;z-index:3}
.env.o .fl{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:radial-gradient(#d4486a,#7a1030);z-index:4;display:grid;place-items:center;font:600 20px 'Playfair Display';box-shadow:0 3px 8px #0006}.env.o .seal{opacity:0;transition:.3s}
.sp{position:absolute;color:#ffe9a8;animation:tw 1.6s infinite alternate}
@keyframes tw{from{opacity:.1;transform:scale(.5)}to{opacity:1;transform:scale(1.2)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes fk{to{transform:scale(1.15,.9) translateX(1px)}}
@keyframes fl{to{transform:translateY(-26px)}}
@keyframes bl{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes hf{to{transform:translateY(-24px)}}
@keyframes gl{50%{box-shadow:0 0 22px 6px #ffd98a}}
@keyframes bt{50%{transform:scale(1.25)}}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}.cf i{position:absolute;top:-14px;width:8px;height:12px;animation:fall linear 2 both}
/* cake */
.cd{display:flex;flex-wrap:wrap;justify-content:center;max-width:270px;margin:20px auto 0}
.can{width:17px;height:50px;background:none;border:0;position:relative;padding:0}.can:before{content:"";position:absolute;left:5px;right:5px;bottom:0;top:16px;background:linear-gradient(#fff,#f4a6bd);border-radius:2px}
.fk{position:absolute;left:3px;top:0;width:11px;height:16px;background:radial-gradient(#fff,#ffb300 60%,transparent);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fk .3s infinite alternate;box-shadow:0 0 14px #ffb300}
.c1{width:290px;max-width:90vw;height:46px;background:#fbe4d8;border-radius:8px 8px 0 0;margin:0 auto;border-top:10px solid #fff}.c2{width:320px;max-width:96vw;height:56px;background:#c25a77;border-radius:0 0 10px 10px;margin:0 auto}
.stars{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;color:var(--gold);margin:18px 0}.stars span{animation:tw 1.5s infinite alternate}
/* timeline */
.tl{position:relative;text-align:left;padding-left:22px;border-left:2px solid var(--gold);margin-top:30px;display:grid;gap:26px}
.mc{position:relative}.mc:before{content:"";position:absolute;left:-30px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.mc .dt{background:none;border:0;padding:0;color:var(--gold)}.cap{margin:.2em 0;color:var(--rose)}
.mc .body{animation:up .6s both;margin-top:12px}.mc p{white-space:pre-line}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end;margin:12px 0}
.bloom{animation:bl 1s both}.beat{display:inline-block;animation:bt 1.2s infinite}
.pol{background:#fffaf2;padding:8px 8px 14px;box-shadow:0 8px 22px #0006;transform:rotate(-2deg);color:var(--ink);width:min(200px,86%);margin:8px;position:relative;text-align:center;font-size:12px}
.pol:before{content:"";position:absolute;top:-9px;left:35%;width:30%;height:16px;background:#d4af6a99;transform:rotate(3deg)}
.ph{width:150px;border:7px solid #222;border-radius:22px;background:#111;margin:8px;overflow:hidden;color:#fff;font-size:12px;text-align:center}
.im{aspect-ratio:4/5;background:#eadccb;display:grid;place-items:center;overflow:hidden;position:relative;color:var(--ink)}.ph .im{aspect-ratio:9/16;background:#2a2a2a;color:#fff}
.im img{width:100%;height:100%;display:block}.imb{border:0;padding:0;background:none;width:100%;height:100%}
.up{display:grid;place-items:center;gap:4px;padding:10px;border:2px dashed currentColor;margin:8px;border-radius:8px;position:absolute;inset:0;cursor:pointer}.up input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.up:focus-within{outline:3px solid #d4486a}
.ctl{display:flex;gap:6px;justify-content:center;margin-top:6px}.ctl button,.ctl label{font-size:11px;background:#0002;border:0;border-radius:6px;padding:3px 8px;position:relative;cursor:pointer}.ctl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.corr{height:90px;position:relative;background:repeating-linear-gradient(90deg,#8a4a5c 0 38px,#6d3548 38px 40px);border-radius:8px}.corr .l{position:absolute;left:12%;bottom:6px}.corr .r{position:absolute;right:12%;bottom:6px}
.news{display:grid;gap:8px}.news div{background:#efe6d2;color:#2a2a2a;padding:8px;font-family:'Playfair Display';transform:rotate(-1deg)}.news div:nth-child(2){transform:rotate(1.5deg)}.news i{display:block;height:4px;background:#2a2a2a33;margin:5px 0}
.moon{background:#1d1038;border-radius:14px;padding:12px;font-size:30px;color:#ffe9a8}.moon u{display:block;text-decoration:none;font-size:14px;background:#fff2;color:#fff;width:70px;border-radius:12px;padding:2px 10px;margin:6px 0}.moon u+u{margin-left:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:300px;margin:auto}.cal span,.cal button{padding:6px 0;border-radius:8px;background:#fff1;border:0;font-size:13px}.cal .on{background:var(--gold);color:var(--ink);font-weight:600;animation:gl 1.6s infinite}
.stamp{display:inline-block;border:2px solid var(--gold);color:var(--gold);padding:2px 14px;transform:rotate(-6deg);font:600 1.6rem 'Playfair Display';text-shadow:0 0 12px var(--gold);margin:10px}
.bus{display:flex;gap:10px;background:#c9a24a;padding:10px;border-radius:10px;justify-content:center}.bus .win{background:#bfe3f2;width:70px;height:56px;border-radius:6px;display:grid;place-items:center}
.call{background:#17111f;border-radius:14px;padding:12px;max-width:260px;margin:auto}.call div{display:flex;gap:8px}.call i{flex:1;height:80px;border-radius:10px;border:2px dashed #fff4}.call b{display:block;width:34px;height:34px;border-radius:50%;background:#d33;margin:10px auto 0}
.lb{position:fixed;inset:0;background:#000d;z-index:60;display:grid;place-items:center;overflow:auto}.lb img{max-width:96vw;max-height:84vh;object-fit:contain}.lb img.z{max-width:none;max-height:none;width:180vw}
/* letter */
.letter{background:radial-gradient(#1a1040,#0b0618);max-width:none;min-height:100vh;padding:80px 18px}.letter .in2{max-width:620px;margin:auto;text-align:left;font-family:'Playfair Display',serif;font-size:1.1rem;line-height:1.9}.letter p{margin:1.2em 0}
.letter:before{content:"";position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 15%,#fff,transparent);background-size:300px 300px}
/* games */
.arena{position:relative;height:340px;border-radius:20px;background:#ffffff10;overflow:hidden;margin:14px 0;touch-action:manipulation}
.h{position:absolute;font-size:34px;background:none;border:0;color:#ff7fa0;animation:bl .3s both;padding:4px}.pop{position:absolute;color:var(--gold);animation:fall .8s both;pointer-events:none}
.opt{display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;background:#fff1;border:1px solid #fff3;text-align:left}.opt.ok{background:#3c8a5a99}.opt.no{background:#a1304a99}
.pz{display:grid;grid-template-columns:repeat(3,1fr);width:min(420px,92vw);margin:16px auto;gap:2px}.pz button{aspect-ratio:1;border:2px solid transparent;background-color:#fff2;padding:0}.pz .sel{border-color:var(--gold)}
.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin:20px 0}.gift{min-height:84px;border-radius:12px;background:linear-gradient(135deg,#c25a77,#8a2a4b);border:1px solid #fff3;position:relative;font:600 1.3rem 'Playfair Display';padding:6px}.gift:before{content:"";position:absolute;left:46%;width:8%;top:0;bottom:0;background:var(--gold);opacity:.8}.gift.op{background:var(--cream);color:var(--ink);font:500 .78rem/1.3 'DM Sans'}.gift.op:before{display:none}
.gh{font-size:90px;color:var(--gold);text-shadow:0 0 40px var(--gold);animation:bt 1.4s infinite}
.lock{width:min(300px,86vw);margin:20px auto;padding:20px;border-radius:14px;background:#ead3b3;color:var(--ink)}
.sky{position:relative;height:230px;overflow:hidden}.ln{position:absolute;width:22px;height:30px;border-radius:40% 40% 30% 30%;background:radial-gradient(#ffe9a8,#e8a23a);box-shadow:0 0 22px #ffcf70;animation:fl 4s ease-in-out infinite alternate}
.fx{position:fixed;z-index:40;right:12px}.fx button{border-radius:99px;border:1px solid #fff4;background:#4a0f24dd;padding:8px 14px}
.bar{position:fixed;top:0;left:0;right:0;height:5px;background:#0003;z-index:40}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold))}
.calm *,.calm *:before{animation:none!important;transition:none!important}.calm .rv{opacity:1;filter:none;transform:none}
@media(min-width:800px){.tl{border:0;padding:0}.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold)}.mc{width:45%}.mc:nth-child(even){margin-left:auto}.mc:before{left:auto;right:-8.8%}.mc:nth-child(even):before{right:auto;left:-8.8%}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.rv{opacity:1;filter:none;transform:none}}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef}=React;

const idbGet=async k=>{try{const d=await new Promise((r,j)=>{const q=indexedDB.open("ar",1);q.onupgradeneeded=()=>q.result.createObjectStore("p");q.onsuccess=()=>r(q.result);q.onerror=j});return await new Promise(r=>{const q=d.transaction("p").objectStore("p").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch{}};
const idbSet=async(k,v)=>{try{const d=await new Promise((r,j)=>{const q=indexedDB.open("ar",1);q.onupgradeneeded=()=>q.result.createObjectStore("p");q.onsuccess=()=>r(q.result);q.onerror=j});d.transaction("p","readwrite").objectStore("p").put(v,k)}catch{}};
const go=id=>document.getElementById(id)?.scrollIntoView({behavior:"smooth"});

function R({children,className=""}){const r=useRef();const [v,setV]=useState(false);useEffect(()=>{if(!window.IntersectionObserver)return setV(true);const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect()}},{threshold:.12});o.observe(r.current);return()=>o.disconnect()},[]);return <div ref={r} className={className+" rv"+(v?" in":"")}>{children}</div>}

/* ===== Photos ===== */
function Photo({id,label,kind}){
 const [src,setSrc]=useState(CFG.photos[id]||"");const [fit,setFit]=useState("cover");const [err,setErr]=useState("");
 useEffect(()=>{if(CFG.photos[id])return;idbGet(id).then(b=>b&&setSrc(URL.createObjectURL(b)))},[]);
 const pick=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/"))return setErr("Please choose an image file.");idbSet(id,f);setErr("");setSrc(URL.createObjectURL(f))};

 {src&&<div className="ctl"><button onClick={()=>setFit(fit==="cover"?"contain":"cover")}>{fit==="cover"?"Show full":"Fill frame"}</button><label>Change{inp}</label></div>}
 {kind!=="shot"&&<figcaption className="hw" style={{fontSize:"1rem"}}>{label}</figcaption>}</figure>}
function Lightbox(){const [s,setS]=useState(null);const [z,setZ]=useState(false);useEffect(()=>{const f=e=>{setZ(false);setS(e.detail)};const k=e=>e.key==="Escape"&&setS(null);addEventListener("lb",f);addEventListener("keydown",k);return()=>{removeEventListener("lb",f);removeEventListener("keydown",k)}},[]);
 return s?<div className="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" onClick={()=>setS(null)}><img className={z?"z":""} src={s.src} alt={s.alt} onClick={e=>{e.stopPropagation();setZ(!z)}}/><button className="btn" autoFocus>Close</button></div>:null}

/* ===== Timeline ===== */
const Cal=()=>{const [s,setS]=useState(false);return <div><div className="cal">{Array.from({length:31},(_,i)=>i===28?<button key={i} className="on" aria-label="29 August" onClick={()=>setS(true)}>29</button>:<span key={i}>{i+1}</span>)}</div><div className="stamp">29 . 08</div><div><span className="beat"><Hrt/></span><span className="beat"><Hrt c="#f2d27a"/></span></div><p className="hw">{s?"29 August — jab ‘you and me’ finally ‘us’ ban gaya.":"Tap the glowing date"}</p></div>};
function Art({k}){
 const mar=["#f2a93b","#f5b94f","#e8902a"];

 if(k==="f1")return <div className="row"><Flw/></div>;

 if(k==="bq")return <div className="row">{["#f4a6bd","#c9b6e4","#f2d27a","#f7c6a0"].map(c=><Flw key={c} c={c}/>)}</div>;

 if(k==="cal")return <Cal/>;
 if(k==="bus")return <div className="bus">{[0,1,2].map(i=><div className="win" key={i}>{i===1&&<Hrt/>}</div>)}</div>;
 if(k==="gn")return <><div className="row">{mar.map(c=><Flw key={c} c={c}/>)}</div><Art k="bus"/></>;
 if(k==="tf")return <div className="row"><svg width="100" viewBox="0 0 90 60" aria-hidden="true"><rect x="8" y="22" width="74" height="34" rx="6" fill="#d4af6a"/><rect x="8" y="14" width="74" height="12" rx="5" fill="#b76e79"/><rect x="36" y="6" width="18" height="8" rx="3" fill="none" stroke="#fff" strokeWidth="3"/></svg>{[0,1,2].map(i=><svg key={i} width="30" height="30"><rect width="28" height="22" rx="4" fill="#6b3a2a"/></svg>)}</div>;
 if(k==="call")return <div className="call" aria-hidden="true"><div><i/><i/></div><b/></div>;
 return null}
const S1=["shot1","Chat screenshot 1 — add yours","shot"],S2=["shot2","Chat screenshot 2 — add yours","shot"];
const M=[
{d:"15 August",t:"The day our story began",c:"The day fate quietly smiled at us.",a:"moon0",ph:[S1,S2,["day","15 August photo","pol"]],s:"15 August. Tab shayad humein bilkul idea nahi tha ki ek normal si conversation humari life ka itna important chapter ban jayegi. Do log, ek shuruaat, aur ek kahaani jo dheere-dheere meri favourite ban gayi. Agar uss din humne baat na ki hoti, toh shayad meri duniya itni khoobsurat na hoti."},
{d:"Third floor",t:"Third floor se ek jhalak...",a:"corr",s:"Aap first floor se third floor aati thi, meri classroom ke door se guzarti thi, aur hum chupchaap ek dusre ko dekhte the. Hum dono jaante the ki kuch hai, par kisi ne kehne ki himmat nahi ki.\n\n“Na koi confession, na koi bade words. Bas ek dusre ko dekh lena, aur din ban jaana.”"},
{d:"At school",t:"The school rumours",a:"news",s:"School mein humare baare mein baatein phailti rahin, par hum pareshaan hone ki jagah unhe enjoy karte rahe.\n\nLog baatein karte rahe, aur hum chupke se muskuraate rahe. Agar pyaar kiya toh darna kya?"},
{d:"21 August",t:"The first flower",a:"f1",s:"Ek chhota sa phool, par uske peeche chhupi feelings kitni badi thi, woh sirf mera dil jaanta tha."},
{d:"22 August",t:"Another flower",a:"f2",s:"Kal ek phool diya tha, aaj phir se. Shayad dil ko aapko khush dekhne ka bahaana mil gaya tha."},
{d:"24 August",t:"Her first bouquet",a:"bq",s:"Jab aapne khud apne haathon se bouquet bana kar diya, main sach mein hairaan reh gaya. Mere dimaag mein bas ek hi thought tha — ‘Ladkiyaan bhi deti hain?!’ 😭❤️ Aur uss bouquet ki value mere liye kisi mehengi gift se kahin zyada thi."},
{d:"25 August",t:"Her second bouquet",a:"bq",s:"Doosra bouquet, aur usme bhi utna hi pyaar, utni hi mehnat. Tab samajh aaya ki pyaar sirf kehne mein nahi, chhoti-chhoti efforts mein bhi hota hai."},
{d:"Late nights",t:"The 2 AM conversations",a:"moon",s:"Hum raat ko takriban 2 baje tak jaagte rahe — apni personal kahaaniyan, purane dard, past relationships, fears aur feelings share karte hue. Lagta tha jaise hum saalon se ek dusre ko jaante hain.\n\nRaat ke 2 baj jaate the, par baatein khatam nahi hoti thi. Humne apne baare mein woh sab share kiya jo shayad har kisi ko nahi batate. Aur dheere-dheere aap mere liye sirf ek person nahi, mera comfort ban gaye."},

{d:"Some chapters",t:"The badge difficulties",s:"Har kahaani mein kuch aise chapters hote hain jo hum choose nahi karte. Hum dono ke badges chale gaye. Bura laga, bahut. Lekin ek baat nahi badli — humari feelings."},
{d:"14 September",t:"The day I’ll never forget",a:"gn",ph:[["sep14","14 September photo","pol"]],s:"14 September. Kitna kuch tha uss ek din mein. Darr bhi, tension bhi, aur phir woh chhote-chhote moments jo aaj bhi dil ke sabse kareeb hain. Pushpanjali ke woh kuch words, bus mein saath baithna, aapka haath mere haath mein, aur aapke gaal pe woh chhota sa kiss... Bas ek-do seconds ka, par mere liye kitna special. Aur jab uss din ke baad aapko ghar par sab face karna pada, mujhe bahut bura laga ki main kuch kar nahi paaya. Kaash aapko kabhi itna kuch face na karna padta. Thank you for those moments. I treasure them."},
{d:"29 September",t:"The first tiffin",a:"tf",s:"29 September. Aapka diya hua pehla tiffin aur chocolates! Pata nahi kyun, par itni si cheez ne mujhe itna zyada khush kar diya. Kyunki woh sirf khaana ya chocolates nahi the — usme aapki care thi. Aur sach kahun toh, sabse sweet cheez chocolates nahi, aap the."},

{d:"20 October",t:"Garba night",ph:[["garba1","Garba photo 1","pol"],["garba2","Garba photo 2","pol"]],s:"20 October — Garbaaaa! Baat toh utni nahi ho paayi, lekin humne photos li, aur woh mere liye bahut special hain. Kabhi-kabhi ek picture bhi poori memory ban jaati hai."}];

/* ===== Letter ===== */
const LET=`Meri pyaari Aradhya,

Happy 17th Birthday, my queeeeen! ❤️

Pata hai, main kabhi-kabhi sochta hoon ki 15 August ko agar humari baat na hui hoti, toh meri life kitni different hoti. Ek normal sa din, ek chhoti si conversation, aur uske baad sab kuch dheere-dheere badal gaya. Mujhe lagta hai ki shayad yeh sab God’s plan tha. Warna itne saare logon ke beech aap hi meri life mein kaise aa gaye?

I love you more than anything, meri jaan. Shayad kabhi-kabhi main apna pyaar utne achhe se dikha nahi paata jitna feel karta hoon. Shayad kabhi words kam pad jaate hain. Par please ek baat hamesha yaad rakhna — aap mere liye bahut, bahut special ho. Aapki ek smile mera mood change kar sakti hai. Aapka ek message mere poore din ko better bana deta hai. Aur aapse baat karna mere din ka favourite part ban gaya hai.

Mujhe humari woh third-floor wali nazrein yaad hain, woh flowers, aapke haathon ke bouquets, raat 2 baje tak ki baatein, 29 August, 14 September ki woh bus ride, pehla tiffin, chocolates, first video call, aur Garba ki pictures. Har memory apni jagah special hai, kyunki har memory mein aap ho.

Aapne hi toh bola tha na, ‘Haath chhodne ke liye thodi thaama hai.’ Main uss baat ko dil se maanta hoon. Main chahta hoon ki jab bhi life mushkil lage, hum ek dusre se honestly baat karein, ek dusre ko samjhein, aur ek dusre ka saath dein. Main aapki khushiyon ka hissa banna chahta hoon, aur mushkil waqt mein bhi aapke saath khada rehna chahta hoon.

Aap sirf meri girlfriend nahi ho. Aap meri favourite person ho, meri favourite smile, meri favourite notification, aur meri favourite kahaani ka sabse khoobsurat chapter.

Aur haannnn, future ki baat aaye toh meri dreams mein aap ho. Shaadi wali dreams bhi hain madammmm 🙈❤️. Mujhe aapke saath bahut saari birthdays, silly fights ke baad patch-ups, late-night conversations, random pictures, chhoti-chhoti celebrations, aur normal se normal din bhi special banana hai. Hum dono apne dreams poore karein, grow karein, aur pyaar aur respect ke saath ek beautiful future banayein.

Thank you meri life mein aane ke liye. Thank you apne efforts ke liye. Thank you mujhe trust karne ke liye. Thank you un moments ke liye jinhe main kabhi bhoolna nahi chahta.

Aaj aapka birthday hai, aur meri wish hai ki aap hamesha khush raho, safe raho, apne dreams achieve karo, aur kabhi yeh mat bhoolna ki aap kitni precious ho. Aapko duniya ki saari happiness mile, kyunki aap deserve karte ho.

Happyyyyyy Birthdayyyyyyy, my beautiful queeeeen, meri Aradhyaaaaa! 😭❤️🙈

I LOVEEEEEEEE YOUUUUUU BOHOTTTTT JYADAAAAA!

Aur haan... iss kahaani ka end abhi thodi aaya hai. Abhi toh bahut saare chapters baaki hain.`;

 useEffect(()=>{if(st==="run"&&t<=0){setSt("end");setHs([])}},[t,st]);

 const start=()=>{setSc(0);setT(30);setHs([]);setSt("run")};

 {st!=="run"&&<div style={{position:"absolute",inset:0,display:"grid",placeItems:"center"}}><button className="btn" onClick={start}>{st==="end"?"Play again":"Start"}</button></div>}</div>
 {st==="run"&&<button className="btn" onClick={()=>hs[0]&&hit(hs[0])}>Keyboard: catch one</button>}

const Q=[["When did we first talk?",["12 August","15 August","18 August"],1],["When did we officially become a couple?",["29 August","25 August","1 September"],0],["When did I give you the first flower?",["19 August","22 August","21 August"],2],["What did you first bring me on 29 September?",["Only chocolates","A handmade bouquet","Tiffin and chocolates"],2],["When was our first video call?",["9 October","2 October","20 October"],0],["Where did we sit together on 14 September?",["In the classroom","On the school steps","On the bus"],2]];
const beep=f=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.15)}catch{}};
function Quiz({fin}){const [i,setI]=useState(0),[sel,setSel]=useState(null),[sc,setSc]=useState(0),[snd,setSnd]=useState(false);const q=Q[i];

const ART="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#f6c1cf'/><stop offset='1' stop-color='#c9b6e4'/></linearGradient></defs><rect width='300' height='200' fill='url(#g)'/><path d='M150 165s-55-36-55-76a30 30 0 0155-18 30 30 0 0155 18c0 40-55 76-55 76z' fill='#b3294e'/><g fill='#fff8'><circle cx='40' cy='40' r='14'/><circle cx='255' cy='150' r='18'/><circle cx='250' cy='45' r='10'/></g><path d='M50 200v-60' stroke='#4f7a46' stroke-width='4'/><circle cx='50' cy='132' r='14' fill='#f2d27a'/></svg>");
